name: Generate RSS Feeds

# 主生成器：在 GitHub 仓库内定时抓取 sources.json 中配置的所有网址，
# 各自生成 <name>.xml（文件名即配置里的 name；seedog -> seedog.xml）。
# 每日零点（北京时间，即 UTC 16:00）自动跑一次；也可手动触发。
# 若某次被反爬拦截（命中挑战页或提取 0 条），脚本不会改写该 feed，
# 本流程保留上一次成功的 feed，订阅不受影响。
on:
  schedule:
    - cron: "0 16 * * *"   # 每日零点（北京时间 UTC+8），即 UTC 16:00 一次

  workflow_dispatch:        # 支持在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # seedog 源走 fetch:browser（Cloudflare 按 IP 信誉挑战，只有真实浏览器 JS 能过）。
      # 仅这一个源需要浏览器；安装失败不阻断其它源，该源会自动跳过、保留旧 feed。
      - name: Install Playwright (for browser-based sources)
        continue-on-error: true
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Run generator (best-effort; per-source failure is safe)
        continue-on-error: true
        env:
          # kkys14 的 cdndefend 挑战 cookie（sources.json 里以 ${KKYS14_COOKIE} 引用）。
          # 需在仓库 Settings → Secrets and variables → Actions 里新建同名 Secret。
          KKYS14_COOKIE: ${{ secrets.KKYS14_COOKIE }}
        run: python src/generate_feed.py

      - name: Validate & commit changed feeds
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET, glob
          ok = True
          for fn in glob.glob("*.xml"):
              try:
                  n = len(ET.parse(fn).getroot().find("channel").findall("item"))
              except Exception:
                  n = 0
              print(f"{fn}: {n} items")
              if n == 0:
                  ok = False
          open("feeds_ok.txt", "w").write("1" if ok else "0")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add -A "*.xml"
          if git diff --cached --quiet; then
            echo "XML 无变化，跳过提交"
          else
            git commit -m "chore: refresh feeds (scheduled)"
            git push
          fi

      # 停更告警：某源连续 N 天未成功生成（lastBuildDate 停在旧日期）时，
      # 输出 ::warning:: 注解 + Job Summary，避免 workflow 全绿掩盖事实。
      # 阈值可用仓库变量 STALE_DAYS 调整（默认 3 天）。不阻断流程。
      - name: Check feeds freshness (stale alert)
        env:
          STALE_DAYS: ${{ vars.STALE_DAYS || '3' }}
        run: |
          python - <<'PY'
          import glob, os, datetime, email.utils
          days = int(os.environ.get("STALE_DAYS", "3"))
          now = datetime.datetime.now(datetime.timezone.utc)
          stale = []
          for fn in sorted(glob.glob("*.xml")):
              text = open(fn, encoding="utf-8").read()
              marker = "<lastBuildDate>"
              if marker not in text:
                  continue
              raw = text.split(marker, 1)[1].split("</lastBuildDate>", 1)[0]
              try:
                  built = email.utils.parsedate_to_datetime(raw)
                  if built.tzinfo is None:
                      built = built.replace(tzinfo=datetime.timezone.utc)
                  age = (now - built).days
              except Exception:
                  continue
              print(f"{fn}: last build {raw} ({age}d ago)")
              if age >= days:
                  stale.append((fn, raw, age))
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          line = "### ⚠️ 停更告警\n\n以下 feed 连续未更新（阈值 %d 天）：\n\n" % days
          for fn, raw, age in stale:
              line += f"- **{fn}**：{raw}（{age} 天前）\n"
              print(f"::warning::{fn} 已 {age} 天未更新（最后成功 {raw}），请检查抓取")
          if stale:
              print(line)
              if summary:
                  with open(summary, "a", encoding="utf-8") as f:
                      f.write(line + "\n")
          else:
              print("全部 feed 均在 %d 天内更新，无停更。" % days)
          PY
